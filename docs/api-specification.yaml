openapi: 3.0.0
info:
  title: ToDo API
  description: FlaskとSQLiteを使用したToDoアプリのRESTful API
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: 開発サーバー

components:
  schemas:
    Todo:
      type: object
      required:
        - title
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: ToDoアイテムの一意の識別子
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: ToDoアイテムのタイトル
        description:
          type: string
          nullable: true
          maxLength: 500
          description: ToDoアイテムの詳細説明
        due_date:
          type: string
          format: date
          nullable: true
          description: ToDoアイテムの期限日 (YYYY-MM-DD)
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
          description: ToDoアイテムの優先度
        status:
          type: string
          enum: [not_started, in_progress, completed]
          default: not_started
          description: ToDoアイテムの現在の状態
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: ToDoアイテムが作成されたタイムスタンプ
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: ToDoアイテムが最後に更新されたタイムスタンプ
      example:
        id: 1
        title: "OpenAPI仕様書の作成"
        description: "ToDo APIのための包括的なOpenAPI仕様を作成する"
        due_date: "2025-04-30"
        priority: "high"
        status: "in_progress"
        created_at: "2025-04-04T12:00:00Z"
        updated_at: "2025-04-04T12:00:00Z"
    
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: HTTPステータスコード
        message:
          type: string
          description: エラーメッセージ
        details:
          type: object
          description: 追加のエラー詳細
          nullable: true
      example:
        code: 404
        message: "ToDoが見つかりません"
    
    ValidationError:
      type: object
      required:
        - code
        - message
        - errors
      properties:
        code:
          type: integer
          format: int32
          description: HTTPステータスコード
        message:
          type: string
          description: エラーメッセージ
        errors:
          type: object
          description: フィールド別のバリデーションエラー
      example:
        code: 400
        message: "バリデーションエラー"
        errors:
          title: "タイトルは必須です"
          priority: "優先度は次のいずれかである必要があります: low, medium, high"
    
    DatabaseError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: HTTPステータスコード
        message:
          type: string
          description: エラーメッセージ
        error_type:
          type: string
          description: データベースエラーの種類
      example:
        code: 500
        message: "データベースエラーが発生しました"
        error_type: "接続に失敗しました"
  
  responses:
    NotFound:
      description: 指定されたリソースが見つかりませんでした
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            TodoNotFound:
              value:
                code: 404
                message: "ID 123のToDoは見つかりません"
    
    BadRequest:
      description: リクエストに無効なパラメータまたはペイロードが含まれています
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            MissingTitle:
              value:
                code: 400
                message: "バリデーションエラー"
                errors:
                  title: "タイトルは必須です"
            InvalidPriority:
              value:
                code: 400
                message: "バリデーションエラー"
                errors:
                  priority: "優先度は次のいずれかである必要があります: low, medium, high"
            InvalidDateFormat:
              value:
                code: 400
                message: "バリデーションエラー"
                errors:
                  due_date: "無効な日付形式です。期待される形式: YYYY-MM-DD"
            TitleTooLong:
              value:
                code: 400
                message: "バリデーションエラー"
                errors:
                  title: "タイトルは100文字を超えることができません"
    
    Conflict:
      description: 競合のためリクエストを完了できませんでした
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            DuplicateTodo:
              value:
                code: 409
                message: "同じタイトルのToDoアイテムが既に存在します"
    
    InternalError:
      description: 内部サーバーエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            DatabaseConnectionFailed:
              value:
                code: 500
                message: "データベースへの接続に失敗しました"
            UnexpectedError:
              value:
                code: 500
                message: "予期しないエラーが発生しました"

paths:
  /todos:
    get:
      summary: すべてのToDoアイテムを取得
      description: すべてのToDoアイテムのリストを返します
      parameters:
        - name: status
          in: query
          description: ステータスによるToDoのフィルタリング
          required: false
          schema:
            type: string
            enum: [not_started, in_progress, completed]
        - name: priority
          in: query
          description: 優先度によるToDoのフィルタリング
          required: false
          schema:
            type: string
            enum: [low, medium, high]
        - name: due_before
          in: query
          description: 指定された日付より前に期限のあるToDoをフィルタリング (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: due_after
          in: query
          description: 指定された日付より後に期限のあるToDoをフィルタリング (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: ToDoアイテムのリスト
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
        '400':
          description: 無効なクエリパラメータ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                InvalidStatus:
                  value:
                    code: 400
                    message: "バリデーションエラー"
                    errors:
                      status: "ステータスは次のいずれかである必要があります: not_started, in_progress, completed"
                InvalidDateFormat:
                  value:
                    code: 400
                    message: "バリデーションエラー"
                    errors:
                      due_before: "無効な日付形式です。期待される形式: YYYY-MM-DD"
        '500':
          $ref: '#/components/responses/InternalError'
    
    post:
      summary: 新しいToDoアイテムを作成
      description: 提供されたデータで新しいToDoアイテムを作成します
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: ToDoアイテムのタイトル
                description:
                  type: string
                  nullable: true
                  maxLength: 500
                  description: ToDoアイテムの詳細説明
                due_date:
                  type: string
                  format: date
                  nullable: true
                  description: ToDoアイテムの期限日 (YYYY-MM-DD)
                priority:
                  type: string
                  enum: [low, medium, high]
                  description: ToDoアイテムの優先度レベル
                status:
                  type: string
                  enum: [not_started, in_progress, completed]
                  description: ToDoアイテムの現在の状態
      responses:
        '201':
          description: ToDoが正常に作成されました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  
  /todos/{id}:
    parameters:
      - name: id
        in: path
        description: ToDoアイテムのID
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    
    get:
      summary: 特定のToDoアイテムを取得
      description: IDによって特定のToDoアイテムを返します
      responses:
        '200':
          description: ToDoアイテム
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: 無効なID形式
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                code: 400
                message: "バリデーションエラー"
                errors:
                  id: "IDは正の整数である必要があります"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    
    put:
      summary: ToDoアイテムを更新
      description: 提供されたデータでToDoアイテムを更新します
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: ToDoアイテムのタイトル
                description:
                  type: string
                  nullable: true
                  maxLength: 500
                  description: ToDoアイテムの詳細説明
                due_date:
                  type: string
                  format: date
                  nullable: true
                  description: ToDoアイテムの期限日 (YYYY-MM-DD)
                priority:
                  type: string
                  enum: [low, medium, high]
                  description: ToDoアイテムの優先度レベル
                status:
                  type: string
                  enum: [not_started, in_progress, completed]
                  description: ToDoアイテムの現在の状態
      responses:
        '200':
          description: ToDoが正常に更新されました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    
    delete:
      summary: ToDoアイテムを削除
      description: IDによってToDoアイテムを削除します
      responses:
        '204':
          description: ToDoが正常に削除されました
        '400':
          description: 無効なID形式
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                code: 400
                message: "バリデーションエラー"
                errors:
                  id: "IDは正の整数である必要があります"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
